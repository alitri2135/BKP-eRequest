
<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h2>Approval Pengajuan</h2>

        <p class="text-secondary mb-0">
            Persetujuan pengajuan barang
        </p>

    </div>

</div>

<div class="row mb-4">

    <div class="col-md-3">

        <div class="card shadow-sm border-0 stat-card"
             data-status="Menunggu Approval 1">

            <div class="card-body text-center">

                <h6 class="text-warning">

                    Approval 1

                </h6>

                <h2 id="statApproval1">

                    0

                </h2>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card shadow-sm border-0 stat-card"
             data-status="Menunggu Approval 2">

            <div class="card-body text-center">

                <h6 class="text-info">

                    Approval 2

                </h6>

                <h2 id="statApproval2">

                    0

                </h2>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card shadow-sm border-0 stat-card"
             data-status="Disetujui">

            <div class="card-body text-center">

                <h6 class="text-success">

                    Disetujui

                </h6>

                <h2 id="statApprove">

                    0

                </h2>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card shadow-sm border-0 stat-card"
         data-status="Ditolak">

            <div class="card-body text-center">

                <h6 class="text-danger">

                    Ditolak

                </h6>

                <h2 id="statReject">

                    0

                </h2>

            </div>

        </div>

    </div>

</div>

<div class="card-custom">

    <div class="row mb-3">

<div class="row mb-3">

        <div class="col-md-4">

        <select
        id="filterStatusApproval"
        class="form-select">

        <option value="">Semua Status</option>

        <option value="Menunggu Approval 1">

        Menunggu Approval 1

        </option>

        <option value="Menunggu Approval 2">

        Menunggu Approval 2

        </option>

        <option value="Disetujui">

        Disetujui

        </option>

        <option value="Ditolak">

        Ditolak

        </option>

        </select>

        </div>

        <div class="col-md-4 ms-auto">

        <input
        type="text"
        id="searchApproval"
        class="form-control"
        placeholder="Cari pengajuan...">

        </div>

        </div>

    </div>

    <div class="table-responsive">

        <table class="table table-hover align-middle">

            <thead class="table-dark">

                <tr>

                    <th width="60">No</th>

                    <th>No Pengajuan</th>

                    <th>Tanggal</th>

                    <th>Pengaju</th>

                    <th>Total Item</th>

                    <th>Status</th>

                    <th width="150">Aksi</th>

                </tr>

            </thead>

            <tbody id="approvalBody">

                <tr>

                    <td colspan="7" class="text-center py-4">

                        Belum ada data approval.

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

    <div class="mt-3">

        <small id="infoApproval">

            0 Data

        </small>

    </div>

</div>

<!-- ===========================
     MODAL DETAIL APPROVAL
=========================== -->

<div class="modal fade" id="approvalModal" tabindex="-1">

    <div class="modal-dialog modal-xl">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">

                    Detail Pengajuan

                </h5>

                <button
                    class="btn-close"
                    data-bs-dismiss="modal">

                </button>

            </div>

            <div class="modal-body">

                <div id="approvalDetail"></div>

                <hr>

                <div class="table-responsive">

                    <table class="table table-bordered">

                        <thead>

                            <tr>

                                <th width="50">No</th>
                                <th>Kode</th>
                                <th>Nama Barang</th>
                                <th width="100">Qty</th>
                                <th width="100">Satuan</th>

                            </tr>

                        </thead>

                        <tbody id="approvalDetailBody">

                        </tbody>

                    </table>

                </div>

            </div>

            <div class="modal-footer">

                <button
                    class="btn btn-danger"
                    id="btnReject">

                    Reject

                </button>

                <button
                    class="btn btn-success"
                    id="btnApprove">

                    Approve

                </button>

            </div>

        </div>

    </div>

</div>
