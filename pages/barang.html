<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2>Master Barang</h2>
        <p class="text-secondary mb-0">
            Kelola seluruh data barang perusahaan
        </p>
    </div>

    <button class="btn btn-primary-custom" id="btnTambahBarang">
        <i class="bi bi-plus-circle"></i>
        Tambah Barang
    </button>
</div>

<div class="card-custom">

    <div class="row mb-3">

        <div class="col-md-4 ms-auto">

            <input
                type="text"
                id="searchBarang"
                class="form-control"
                placeholder="Cari barang...">

        </div>

    </div>

    <div class="table-responsive">

        <table class="table table-hover align-middle">

            <thead class="table-dark">

                <tr>

                    <th>Kode</th>
                    <th>Nama Barang</th>
                    <th>Kategori</th>
                    <th>Satuan</th>
                    <th>Stok</th>
                    <th>Status</th>
                    <th width="170">Aksi</th>

                </tr>

            </thead>

            <tbody id="barangBody">

            </tbody>

        </table>

    </div>

    <div class="d-flex justify-content-between align-items-center mt-3">

        <small id="infoBarang">
            0 Data
        </small>

        <div id="paginationBarang">

        </div>

    </div>

</div>

<!-- Modal Barang -->
<div class="modal fade" id="barangModal" tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">Tambah Barang</h5>

                <button class="btn-close"
                        data-bs-dismiss="modal"></button>

            </div>

            <div class="modal-body">

                <div class="mb-3">

                    <label>Kode Barang</label>

                    <input
                        type="text"
                        id="kodeBarang"
                        class="form-control"
                        readonly>

                </div>

                <div class="mb-3">

                    <label>Nama Barang</label>

                    <input
                        type="text"
                        id="namaBarang"
                        class="form-control">

                </div>

                <div class="mb-3">

                    <label>Kategori</label>

                    <select
                        id="kategoriBarang"
                        class="form-select">
                    </select>

                </div>

                <div class="mb-3">

                    <label>Satuan</label>

                    <select
                        id="satuanBarang"
                        class="form-select">
                    </select>

                </div>

                <div class="mb-3">

                    <label>Stok</label>

                    <input
                        type="number"
                        id="stokBarang"
                        class="form-control"
                        value="0"
                        min="0">

                </div>
                
                <div class="mb-3">

                    <label>Status</label>

                    <select
                        id="statusBarang"
                        class="form-select">

                        <option value="ACTIVE">ACTIVE</option>
                        <option value="INACTIVE">INACTIVE</option>

                    </select>

                </div>

            </div>

            <div class="modal-footer">

                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Batal

                </button>

                <button
                    class="btn btn-primary"
                    id="btnSimpanBarang">

                    Simpan

                </button>

            </div>

        </div>

    </div>

</div>
