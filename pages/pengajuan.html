<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h2>Pengajuan Barang</h2>

        <p class="text-secondary mb-0">
            Kelola pengajuan barang
        </p>

    </div>

    <button class="btn btn-primary-custom" id="btnTambahPengajuan">

        <i class="bi bi-plus-circle"></i>

        Pengajuan Baru

    </button>

</div>

<div class="card-custom">

    <div class="row mb-3">

        <div class="col-md-4 ms-auto">

            <input
                type="text"
                id="searchPengajuan"
                class="form-control"
                placeholder="Cari pengajuan...">

        </div>

    </div>

    <div class="table-responsive">

        <table class="table table-hover align-middle">

            <thead class="table-dark">

                <tr>

                    <th>No</th>
                    <th>No Pengajuan</th>
                    <th>Tanggal</th>
                    <th>Pengaju</th>
                    <th>Total Item</th>
                    <th>Status</th>
                    <th width="120">Aksi</th>

                </tr>

            </thead>

            <tbody id="pengajuanBody">

            </tbody>

        </table>

    </div>

    <div class="mt-3">

        <small id="infoPengajuan">

            0 Data

        </small>

    </div>

</div>

<!-- ===========================
     MODAL PENGAJUAN
=========================== -->

<div class="modal fade"
     id="pengajuanModal"
     tabindex="-1">

<div class="modal-dialog modal-xl">

<div class="modal-content">

<div class="modal-header">

<h5 class="modal-title">

Pengajuan Barang

</h5>

<button
class="btn-close"
data-bs-dismiss="modal">

</button>

</div>

<div class="modal-body">

<div class="row">

<div class="col-md-6 mb-3">

<label>No Pengajuan</label>

<input
id="noPengajuan"
class="form-control"
readonly>

</div>

<div class="col-md-6 mb-3">

<label>Tanggal</label>

<input
type="date"
id="tanggalPengajuan"
class="form-control">

</div>

<div class="col-md-6 mb-3">

<label>Nama Pengaju</label>

<input
id="namaPengaju"
class="form-control">

</div>

<div class="col-md-6 mb-3">

<label>Keterangan</label>

<input
id="keteranganPengajuan"
class="form-control">

</div>

<hr class="my-3">
<h6 class="mb-3">Daftar Barang</h6>

<div class="row">

    <div class="col-md-5 mb-3">

        <label>Barang</label>

        <select
            id="barangPengajuan"
            class="form-select">

        </select>

    </div>

    <div class="col-md-2 mb-3">

        <label>Qty</label>

        <input
            type="number"
            id="qtyPengajuan"
            class="form-control"
            min="1">

    </div>

    <div class="col-md-2 mb-3">

        <label>Satuan</label>

        <input
            id="satuanPengajuan"
            class="form-control"
            readonly>

    </div>

    <div class="col-md-3 d-flex align-items-end mb-3">

        <button
            class="btn btn-success w-100"
            id="btnTambahItem">

            <i class="bi bi-plus-circle"></i>

            Tambah Item

        </button>

    </div>

</div>

<div class="table-responsive">

    <table class="table table-bordered table-striped">

        <thead class="table-light">

            <tr>

                <th width="60">No</th>

                <th>Kode</th>

                <th>Nama Barang</th>

                <th width="100">Qty</th>

                <th width="120">Satuan</th>

                <th width="80">Aksi</th>

            </tr>

        </thead>

        <tbody id="detailPengajuanBody">

            <tr>

                <td colspan="6" class="text-center text-secondary">

                    Belum ada barang.

                </td>

            </tr>

        </tbody>

    </table>

</div>

</div>

<div class="modal-footer">

    <button
        class="btn btn-secondary"
        data-bs-dismiss="modal">

        Batal

    </button>

    <button
        class="btn btn-primary"
        id="btnSimpanPengajuan">

        Simpan Pengajuan

    </button>

</div>

</div>

</div>

</div>
