<div id="loginOverlay">

    <div class="login-card">

        <div class="text-center mb-4">

            <img src="assets/img/logo.png" width="90">

            <h2 class="mt-3">BKP e-Request</h2>

            <small>PT. Bagaskara</small>

        </div>

        <div class="mb-3">

            <label>Username</label>

            <input
                type="text"
                class="form-control"
                id="loginUsername"
                autocomplete="username">

        </div>

        <div class="mb-3">

            <label>Password</label>

            <input
                type="password"
                class="form-control"
                id="loginPassword"
                autocomplete="current-password">

        </div>

        <button
            type="button"
            class="btn btn-warning w-100"
            onclick="login()">

            LOGIN

        </button>

    </div>

</div>
