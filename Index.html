<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BKP e-Request</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

   
    <!-- SweetAlert -->

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Style -->

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div id="loginOverlay">

    <div class="login-card">

        <div class="text-center mb-4">

            <img src="assets/img/logo.png" width="90">

            <h2>BKP e-Request</h2>

            <small>PT. Bagaskara</small>

        </div>

        <div class="mb-3">

            <label>Username</label>

            <input
                id="loginUsername"
                class="form-control">

        </div>

        <div class="mb-3">

            <label>Password</label>

            <input
                id="loginPassword"
                type="password"
                class="form-control">

        </div>

        <button
            class="btn btn-warning w-100"
            onclick="login()">

            LOGIN

        </button>

    </div>

</div>

<div id="app" style="display:none;">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo-area">

            <img src="assets/img/logo.png">

            <h3>BKP e-Request</h3>

            <small>PT. Bagaskara</small>

        </div>

        <ul>

            <li id="menuDashboard" class="active" data-page="dashboard">

                <i class="bi bi-speedometer2"></i>

                Dashboard

            </li>

            <li id="menuBarang" data-page="barang">

                <i class="bi bi-box-seam"></i>

                Master Barang

            </li>

            <li id="menuPengajuan" data-page="pengajuan">

                <i class="bi bi-file-earmark-plus"></i>

                Pengajuan

            </li>

            <li id="menuApproval" data-page="approval">

                <i class="bi bi-check2-square"></i>

                Approval

            </li>

            <li id="menuUser" data-page="user">

                <i class="bi bi-people"></i>

                User

            </li>

            <li id="menuLogout">

                <i class="bi bi-box-arrow-right"></i>

                Logout

            </li>

        </ul>

    </aside>

    <!-- Content -->

    <main>

        <nav class="topbar">

            <div>

                <h4>Dashboard</h4>

            </div>

            <div>

                <span id="username">

                    Administrator

                </span>

            </div>

        </nav>

        <div id="content">

        </div>

    </main>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/barang.js"></script>
<script src="js/user.js"></script>
<script src="js/pengajuan.js"></script>
<script src="js/approval.js"></script>
<script src="js/api.js"></script>
<script src="js/login.js"></script>
<script src="js/app.js"></script>

</body>
</html>
